{% extends "base.html" %}

{% block content %}

    <style>
        /* Estilos gerais */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        /* Container do dashboard */
        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Estilo do título */
        h1 {
            text-align: center;
            color: #333;
        }

        /* Card superior com campo de seleção e barra de progresso */
        .selection-progress-container {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Estilo do campo select */
        .city-select, .zone-select, .session-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1em;
            color: #333;
            background-color: #f9f9f9;
        }

        /* Barra de progresso */
        .progress-bar {
            height: 20px;
            border-radius: 8px;
            background-color: #ddd;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #4caf50;
            width: 75%;
        }

        /* Container dos cards de candidatos */
        .candidates-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        /* Card de candidato */
        .candidate-card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 180px;
            height: 180px;
            padding: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .candidate-card h3 {
            margin: 0;
            font-size: 1.1em;
            color: #333;
        }

        .candidate-votes {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .candidate-percentage {
            font-size: 1em;
            color: #4caf50;
        }


        .candidatos-container {
            display: flex;
            justify-content: space-between;
        }

        .candidato {
            background: #fff;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 30%;
        }

        .candidato img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .candidato p {
            margin: 5px 0;
        }

        .barra-porcentagem-container {
            height: 15px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            margin: 10px 0;
        }

        .barra-porcentagem {
            height: 100%;
            background-color: #007bff;
            width: 0;
            transition: width 1s ease;
        }

        .porcentagem-texto {
            margin-left: 10px;
            font-weight: bold;
        }

        .barra-progresso-container {
            width: 100%;
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
            position: relative;
        }

        .barra-progresso {
            height: 100%;
            background-color: #007bff;
            width: 0;
            transition: width 1s ease-in-out;
        }
    </style>

    <div class="dashboard-container">
        <h1>Resultado da Votação</h1>


        <!-- Card superior com seleção de zona, sessão e barra de progresso -->
        <div class="selection-progress-container">
            <!-- Campo select para a Zona -->
            <select class="zone-select" id="zonaCandidato" onchange="filtrarPorZonaCandidato(this.value)">
                <option value="">Selecione uma Zona</option>
                {% for zona in zonas %}
                    <option value="{{ zona }}">{{ zona }}</option>
                {% endfor %}
            </select>

            <!-- Campo select para a Sessão -->
            <select class="session-select" id="sessaoCandidato" onchange="filtrarPorSessaoCandidato(this.value)">
                <option value="">Selecione uma Sessão</option>
                {% for sessao in sessoes %}
                    <option value="{{ sessao.id }}">{{ sessao.nome }}</option>
                {% endfor %}
            </select>

            <!-- Barra de progresso -->
            <h2>Progresso da Contagem de Votos</h2>
            <div class="progress-bar">
                <div class="progress-bar-fill" id="campo-progresso-votacao"
                     style="width: {{ candidatos.percentualVotosValidos }}%;"></div>
            </div>
            <p><span id="percentual-candidato">{{ candidatos.percentualVotosValidos }}</span>% dos votos apurados</p>
        </div>
    </div>

    <section id="apuracao" class="tela">
        {% include "template_candidato.html" %}
    </section>

    <script>
        async function filtrarPorZonaCandidato(zonaId) {
            await buscarCandidatoSessao(true); // Chama novamente a função para atualizar os votos
        }

        async function filtrarPorSessaoCandidato(sessaoId) {
            await buscarCandidatoSessao(false); // Chama novamente a função para atualizar os votos
        }

        async function buscarCandidatoSessao(carregaFiltro) {
            try {
                const response = await fetch('/get_filtro_sessao_candidato/?zona=' + document.getElementById('zonaCandidato').value + '&sessao=' + document.getElementById('sessaoCandidato').value); // URL da view Django
                if (!response.ok) {
                    throw new Error("Erro ao buscar dados");
                }
                const data = await response.json();


                if (data.status === 200) {
                    if (carregaFiltro) {

                        const sessoes = document.getElementById('sessaoCandidato');

                        while (sessoes.options.length > 0) {
                            sessoes.remove(0);
                        }
                        const option = document.createElement('option');
                        option.value = '';
                        option.textContent = 'Selecione a sessão';
                        sessoes.appendChild(option);

                        data.sessoes.forEach((sessao) => {
                            const option = document.createElement('option');
                            option.value = sessao;
                            option.textContent = sessao;
                            sessoes.appendChild(option);
                        });
                    }
                    document.getElementById("percentual-candidato").innerText = data.percentual;
                    document.getElementById('campo-progresso-votacao').style.width = data.percentual + '%';
                    document.getElementById('apuracao').innerHTML = data.html;

                } else {
                    document.getElementById('recebe-informacao').innerText = data.chave;
                }


            } catch (error) {
                console.error(error);
            }
        }
    </script>

{% endblock %}
